# =============================================================================
# SBA-XAI Ethiopia — pipeline configuration
# Explainable ML with Actionable Counterfactuals for Skilled Birth Attendance
# Study Protocol v1.2 (Aug 2026) — Tesfaye B., Esuyawkal M., Abebaw A., Woldia University
# =============================================================================

project:
  name: "sba_xai_ethiopia"
  random_seed: 42
  survey_year: 2024            # tags every row so combined-round scenarios
                                # (step12_scenario_comparison.py) can tell
                                # EDHS rounds apart after concatenation

# -----------------------------------------------------------------------------
# Paths. glob_pattern is used because the raw archive's folder suffixes are
# inconsistent (e.g. ETBR8ADT/ vs ETIR8ADT/ vs ETGE8AFL/), so we search by the
# recode's file stem rather than hardcoding a folder name.
#
# NOTE: this file's outputs/models/tables/etc. paths are UNCHANGED from the
# original single-round layout (outputs/, not outputs/by_round/2024/) so any
# existing local run you've already done keeps working exactly as before —
# `python main.py` still reads/writes the same places it always has. The new
# config_2016.yaml (added for the 2016-vs-2024 comparison) uses its own
# outputs/by_round/2016/ tree instead, and step12_scenario_comparison.py
# looks in both places (see its SOURCES list) rather than requiring you to
# rerun 2024 under a new path.
# -----------------------------------------------------------------------------
paths:
  data_root: "data/raw/2024"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  outputs_dir: "outputs"
  models_dir: "outputs/models"
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"
  reports_dir: "outputs/reports"
  log_dir: "outputs/logs"

# -----------------------------------------------------------------------------
# Recodes used (protocol section 3.1). Each entry gives a case-insensitive
# glob (relative to paths.data_root) used to locate the .dta file, since the
# archive nests recodes under year/recode-named subfolders.
# -----------------------------------------------------------------------------
datasets:
  births_recode:
    code: "ETBR8ADT"
    glob: "**/ETBR8AFL.dta"
    role: "primary — outcome (SBA) + birth-level predictors"
  individual_recode:
    code: "ETIR8ADT"
    glob: "**/ETIR8AFL.dta"
    role: "secondary — demographic/socioeconomic/WASH/media/health-access predictors"
  geographic_data:
    code: "ETGE8AFL"
    glob: "**/ETGE8AFL.shp"
    role: "cluster-to-region/zone linkage check ONLY — never facility-distance (protocol 6.4)"
  # Explicitly out of scope (protocol 3.1) — listed here only so the loader
  # can assert they are NOT accidentally pulled into the model:
  excluded:
    - "ETHR8ADT"   # Household Recode — WASH vars already complete in IR
    - "ETKR8ADT"   # Children's Recode — wrong unit of analysis
    - "ETMR8ADT"   # Men's Recode — out of scope
    - "ETPR8ADT"   # Household Member Recode — out of scope

# -----------------------------------------------------------------------------
# Merge keys
# -----------------------------------------------------------------------------
merge:
  birth_id_vars: ["caseid", "bidx"]      # BR row identity
  woman_id_var: "caseid"                  # BR <-> IR merge key
  cluster_var: "v001"                     # <-> GE DHSCLUST

# -----------------------------------------------------------------------------
# Eligibility (protocol section 4.1)
# -----------------------------------------------------------------------------
eligibility:
  recency_var: "b19"           # months since birth; delivery-care module scope
  recency_max_months: 59      # b19 <= 59, NOT the standard 5-year (59mo) window
  fallback_recency_vars: ["b6", "b7"]   # for children who died, per protocol

# -----------------------------------------------------------------------------
# Outcome (protocol section 4.2)
# -----------------------------------------------------------------------------
outcome:
  name: "sba"
  skilled_attendant_vars: ["m3a", "m3b", "m3c", "m3d"]   # doctor/nurse/midwife/health officer
  positive_if_any_equals: 1

# -----------------------------------------------------------------------------
# Predictors (protocol section 5). "raw" = model input. "recode" = reporting-
# only derived variable, NEVER substituted into the model matrix.
# -----------------------------------------------------------------------------
predictors:
  maternal_demographic:
    raw: ["v012", "v106", "v511", "v218", "bord", "v212"]
    # bord (true birth order for THIS birth) added alongside v218 (total
    # living children as of interview, which mixes in births after this
    # one for a BR-level model) — protocol extension per co-author review.
    # v212 (age at first birth) added alongside — no leakage concern
    # (stable retrospective fact), always defined for a respondent with
    # >=1 birth, which every row in a BR-merged sample satisfies.
  socioeconomic:
    raw: ["v190", "v025"]
  health_system_access:
    raw: ["m14", "v467b", "v467c", "v467d", "v467f", "v481"]
    # RESOLVED (was "v467a-c added alongside v467d..."): the study team's
    # own ETBR8AFL.DO confirms v467a is a legacy item never fielded in
    # Ethiopia's EDHS 2024/25 ("NA - ..." in its own variable label) —
    # dropped entirely, not sentinel-filled. v467b/c were never actually
    # problematic (see step01_data_loading.py's BR_COLS comment). v467f
    # ("not wanting to go alone") is a real 4th barrier item found in the
    # .DO file that was missing from the original battery — added here.
    source: ["BR", "IR"]
  media_exposure:
    raw: ["v157", "v158", "v159"]
  reproductive:
    raw: ["m10"]
    # m10 = wantedness of this pregnancy at conception (then/later/no
    # more) — retrospective intent, not a post-outcome variable; shares
    # the same births-recode module (and b19<=35 scoping) as m3a-d/m14.
  wash:
    raw: ["v113", "v116"]
  household_composition:
    raw: ["v701", "v705", "v501"]
    # v501 (current marital/union status) added — DHS documents this as
    # never missing, unlike v701/v705/v511 which are conditional on it.
  geographic:
    raw: ["v024"]          # descriptive/prevalence only, 14 categories
    derived: ["region_stratum"]   # used for formal SHAP interaction testing

  # variables explicitly excluded from the base model (protocol section 5, note)
  excluded:
    - "v131"    # ethnicity — not a usable field this survey round
    - "v744a"   # wife-beating-justification items — pending co-author
    - "v744b"   # discussion on interpretive/ethical framing
    - "v744c"
    - "v744d"
    - "v744e"
    # Clinical metrics (BMI, gravidity, pre-eclampsia, diabetes) considered
    # and excluded, not merely omitted: (1) standard EDHS BR/IR does not
    # carry these — they require an optional biomarker module not every
    # DHS phase fields; (2) gravidity and delivery complications recorded
    # near/at the birth event risk sliding into the leakage category
    # already excluded above (protocol's post-outcome/clinical-outcome
    # rule) unless carefully dated well before the delivery. If a future
    # extract genuinely has a biomarker module, revisit this decision
    # against that module's actual variable-level timing documentation
    # rather than adding these by name here.

# -----------------------------------------------------------------------------
# Region labels — v024 code -> region name for EDHS 2024/25 (post-2023
# regional restructuring: South West Ethiopia, South Ethiopia, Central
# Ethiopia exist as their own regions here; they did not in 2016 — see
# config_2016.yaml's region_labels for the earlier round).
# # verify against ETBR8AFL.DO / .MAP before trusting for publication
# (README "Known assumptions").
# -----------------------------------------------------------------------------
region_labels:
  1: "Tigray"
  2: "Afar"
  3: "Amhara"
  4: "Oromia"
  5: "Somali"
  6: "Benishangul-Gumuz"
  7: "Central Ethiopia"
  8: "Sidama"
  9: "South West Ethiopia"
  10: "South Ethiopia"
  12: "Gambella"
  13: "Harari"
  14: "Addis Ababa"
  15: "Dire Dawa"

# -----------------------------------------------------------------------------
# Region stratum mapping (protocol section 6.2) — collapses v024 (14 regions)
# into 3 strata for formal SHAP interaction testing. Whole-region unions only.
# -----------------------------------------------------------------------------
region_stratum:
  "Pastoralist/Arid": ["Afar", "Somali"]
  "Agrarian Highlands": ["Amhara", "Tigray", "Oromia", "SNNPR",
                          "Central Ethiopia", "Sidama", "South Ethiopia",
                          "South West Ethiopia", "Benishangul-Gumuz", "Gambella"]
  "Urban/Peri-urban": ["Addis Ababa", "Dire Dawa", "Harari"]

  small_sample_regions_flagged:  # n < 100 post-filter — interpret cautiously
    - "Afar"
    - "Benishangul-Gumuz"
    - "Gambella"
    - "Dire Dawa"
    - "Harari"

# -----------------------------------------------------------------------------
# Reporting-only recodes (protocol section 5 table) — descriptive/policy-brief
# use only. Kept in a separate namespace from model features on purpose.
# -----------------------------------------------------------------------------
reporting_recodes:
  age_group_5yr: {source: "v012", bins: [15, 20, 25, 30, 35, 40, 45, 50]}
  education_simple: {source: "v106", map: {0: "None", 1: "Primary", 2: "Secondary+", 3: "Secondary+"}}
  parity_group: {source: "v218", bins: [0, 1, 3, 99], labels: ["1", "2-3", "4+"]}
  anc_group: {source: "m14", bins: [-1, 0, 3, 99], labels: ["0", "1-3", "4+"]}
  media_any_exposure: {source: ["v157", "v158", "v159"], rule: "any > 0"}
  wash_improved_flag: {source: ["v113", "v116"], rule: "JMP ladder — see src/feature_engineering.py"}

# -----------------------------------------------------------------------------
# Complex survey design (protocol section 6.1)
# -----------------------------------------------------------------------------
survey_design:
  weight_var: "v005"       # sample weight (÷ 1,000,000 per DHS convention)
  weight_divisor: 1000000
  psu_var: "v021"          # primary sampling unit / cluster
  strata_var: "v022"       # sampling strata
  model_fitting: "unweighted"        # standard practice for tree ensembles
  population_estimates: "weighted"   # prevalence, weighted SHAP summaries

# -----------------------------------------------------------------------------
# Validation (protocol section 6.3)
# -----------------------------------------------------------------------------
validation:
  cv_folds: 5
  cv_group_var: "v021"                 # cluster-based CV, not row-based
  geographic_holdout_fraction: 0.2     # held-out clusters, primary generalization test
  metrics: ["roc_auc", "average_precision", "precision", "recall", "f1", "brier_score"]
  equity_check_var: "v190"             # performance compared across wealth quintiles

# -----------------------------------------------------------------------------
# Model (protocol section 6.3)
# -----------------------------------------------------------------------------
model:
  algorithm: "xgboost"        # "xgboost" | "lightgbm"
  params:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    eval_metric: "auc"
  early_stopping_rounds: 50

# -----------------------------------------------------------------------------
# Class imbalance handling (see step07_model_training.py's
# fit_with_class_weight docstring for the full reasoning per method).
# Current observed prevalence: 2024/25 ~57%/43%, 2016 ~39%/61% — mild
# imbalance, not severe, so don't expect either method to move results
# dramatically; that itself is useful to confirm empirically rather than
# assume.
# -----------------------------------------------------------------------------
class_imbalance:
  method: "class_weight"      # "class_weight" (default) | "smote" | "none"
  smote:
    # Only used when method: "smote". k_neighbors is capped automatically
    # to (minority class n - 1) per fold/pool if the configured value is
    # too large for a small fold.
    k_neighbors: 5
    # Columns SMOTENC treats as continuous (linearly interpolated between
    # neighbors); every other model feature is treated as categorical
    # (kept at a real neighbor's value, never interpolated) — see
    # _smote_resample's docstring for why this matters on this feature set
    # specifically (majority categorical/sentinel-coded).
    continuous_features: ["v012", "v218", "bord", "v212", "m14"]

# -----------------------------------------------------------------------------
# Explainability (protocol section 7)
# -----------------------------------------------------------------------------
xai:
  shap:
    explainer: "tree"
    interaction_pairs:     # region_stratum x modifiable predictor (protocol 6.2)
      - ["region_stratum", "m14"]      # ANC visits
      - ["region_stratum", "v467d"]    # distance-is-a-problem
      - ["region_stratum", "v190"]     # wealth
      - ["region_stratum", "v157"]     # media exposure (radio)
    partial_dependence_vars: ["m14", "v467d"]

  counterfactuals:
    engine: "dice_ml"
    role: "supplementary sensitivity analysis — NOT a primary study contribution"
    n_per_stratum: 3
    mutability:
      modifiable: ["m14", "v157", "v158", "v159", "v481"]
      semi_modifiable: ["v467d"]
      immutable: ["v012", "v106", "v190", "v025", "v024"]
    validity_check: true    # report % of CFs within observed empirical covariate distribution

# -----------------------------------------------------------------------------
# Ethics / provenance (protocol section 8) — logged into every output artifact
# -----------------------------------------------------------------------------
provenance:
  data_use_agreement: "DHS Program data request — approved secondary analysis of de-identified data"
  irb: "Woldia University institutional ethics clearance"
  causal_disclaimer: >
    All SHAP and counterfactual outputs are model-derived associational
    estimates from a cross-sectional, observational design — NOT causal
    effect estimates.
